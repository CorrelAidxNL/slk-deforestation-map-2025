<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  #chart-wrap {
    position: relative;   /* required by Chart.js responsive mode */
    width: 100vw;
    height: 100vh;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.6.0/Chart.min.js"></script>
</head>
<body>
<div id="chart-wrap">
  <canvas id="canvas"></canvas>
</div>
<script>
    var data = {
            labels: ["2001", "2002", "2003", "2004", "2005","2006", "2007", "2008", "2009", "2010", "2011", "2012", "2013", "2014","2015", "2016", "2017", "2018", "2019", "2020", "2021", "2022", "2023", "2024"],
            datasets: [
                {
                    label: "SLK",
                    backgroundColor: 'rgba(47, 62, 84, 0.5)',
                    borderWidth: 1,
                    data: [1001, 188, 231, 442, 261, 443, 583, 965, 576, 459, 643, 1616, 796, 740, 496, 946, 718, 607, 727, 0,0, 918, 1845, 1212],
                    xAxisID: "bar-x-axis1"
                },
                {
                    label: "GFW",
                    backgroundColor: 'rgba(0, 0, 0, 0.2)',
                    borderWidth: 1,
                    data: [1122, 215, 261, 573, 314, 520, 811, 1143, 777, 468, 802, 1739, 768, 761, 471, 912, 626, 594, 697, 971, 520, 785, 1465, 772],
                    xAxisID: "bar-x-axis2"
                }
            ]
        };

        var options = {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                xAxes: [
                    {
                        id: "bar-x-axis2",
                        stacked: true,
                        categoryPercentage: 0.5,
                        barPercentage: 0.5
                    },
                    {
                        display: false,
                        stacked: true,
                        id: "bar-x-axis1",
                        type: 'category',
                        categoryPercentage: 0.5,
                        barPercentage: 0.5,
                        gridLines: {
                            offsetGridLines: true
                        },
                        offset: true
                    }
                ],
                yAxes: [{
                    id: "bar-y-axis1",
                    stacked: false,
                    ticks: {
                        beginAtZero: true
                    }
                }]
            }
        };

        var ctx = document.getElementById("canvas").getContext("2d");
        var myBarChart = new Chart(ctx, {
            type: 'bar',
            data: data,
            options: options
        });
</script>
</body>
</html>
